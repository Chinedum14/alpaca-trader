name: Daily Alpaca Trade

on:
  # Scheduled runs are DISABLED. Daily trading now runs on a dedicated server
  # via a systemd timer (alpaca-trader.timer, 15:55 America/New_York), which is
  # far more reliable than GitHub's scheduler. The old staggered-cron block is
  # kept here (commented) for reference / quick re-enable.
  #
  # schedule:
  #   - cron: "40 19 * * 1-5"   # 19:40 UTC = 15:40 EDT (summer)
  #   - cron: "48 19 * * 1-5"   # 19:48 UTC = 15:48 EDT (summer)
  #   - cron: "55 19 * * 1-5"   # 19:55 UTC = 15:55 EDT (summer)
  #   - cron: "40 20 * * 1-5"   # 20:40 UTC = 15:40 EST (winter)
  #   - cron: "48 20 * * 1-5"   # 20:48 UTC = 15:48 EST (winter)
  #   - cron: "55 20 * * 1-5"   # 20:55 UTC = 15:55 EST (winter)
  workflow_dispatch: {}        # manual runs from the Actions tab (window not enforced)

permissions:
  contents: read

concurrency:
  group: daily-trade
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
      ALPACA_LIVE: "0"                         # paper account
      DRY_RUN: ${{ vars.DRY_RUN || '0' }}      # set repo Variable DRY_RUN=1 to test safely
      SKIP_IF_CLOSED: "1"
      # Enforce the 3:55 PM ET window on scheduled runs only; manual runs bypass it.
      ENFORCE_WINDOW: ${{ github.event_name == 'schedule' && '1' || '0' }}
      TRADE_WINDOW_ET: "15:55"
      TRADE_WINDOW_TOL_MIN: "20"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily strategy
        run: python run_daily.py
