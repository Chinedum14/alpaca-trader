name: Daily Alpaca Trade

on:
  schedule:
    # Target: 3:55 PM ET, every weekday (5 min before the 4:00 PM close).
    # GitHub cron is UTC and does NOT follow US daylight saving, so we schedule
    # BOTH possible UTC times and let run_daily's ENFORCE_WINDOW guard trade only
    # at the one that is actually 15:55 ET. The wrong-season cron self-skips.
    - cron: "55 19 * * 1-5"   # 19:55 UTC = 15:55 EDT (summer)
    - cron: "55 20 * * 1-5"   # 20:55 UTC = 15:55 EST (winter)
  workflow_dispatch: {}        # manual runs from the Actions tab (window not enforced)

permissions:
  contents: read

concurrency:
  group: daily-trade
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
      ALPACA_LIVE: "0"                         # paper account
      DRY_RUN: ${{ vars.DRY_RUN || '0' }}      # set repo Variable DRY_RUN=1 to test safely
      SKIP_IF_CLOSED: "1"
      # Enforce the 3:55 PM ET window on scheduled runs only; manual runs bypass it.
      ENFORCE_WINDOW: ${{ github.event_name == 'schedule' && '1' || '0' }}
      TRADE_WINDOW_ET: "15:55"
      TRADE_WINDOW_TOL_MIN: "20"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily strategy
        run: python run_daily.py
